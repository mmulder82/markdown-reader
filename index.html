<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Reader</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" id="highlight-light">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="highlight-dark" disabled>
</head>
<body class="light-mode">
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Markdown Reader</h2>
                <button id="theme-toggle" class="icon-button" title="Toggle dark mode">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path class="sun" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>
                        <path class="moon" style="display:none;" d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
                    </svg>
                </button>
            </div>

            <button id="new-file" class="primary-button">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 4a.5.5 0 01.5.5v3h3a.5.5 0 010 1h-3v3a.5.5 0 01-1 0v-3h-3a.5.5 0 010-1h3v-3A.5.5 0 018 4z"/>
                </svg>
                Nieuw Bestand
            </button>

            <button id="open-file" class="secondary-button">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M2 2a2 2 0 012-2h8a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V2zm2 0v12h8V2H4z"/>
                    <path d="M6 4h4v1H6V4zm0 2h4v1H6V6zm0 2h4v1H6V8z"/>
                </svg>
                Open MD Bestand
            </button>

            <div class="recent-files">
                <h3>Recent geopend</h3>
                <ul id="recent-list"></ul>
            </div>
        </aside>

        <!-- Main content area -->
        <main class="main-content">
            <!-- Toolbar -->
            <div id="toolbar" class="toolbar" style="display: none;">
                <div class="toolbar-left">
                    <span id="file-name" class="file-name-display">Untitled.md</span>
                </div>
                <div class="toolbar-right">
                    <button id="view-toggle" class="toolbar-button" title="Toggle view mode">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <span id="view-mode-text">Preview</span>
                    </button>
                    <button id="save-file" class="toolbar-button primary" title="Save file">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        Opslaan
                    </button>
                </div>
            </div>

            <div id="drop-zone" class="drop-zone">
                <div class="drop-zone-content">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                        <polyline points="13 2 13 9 20 9"></polyline>
                    </svg>
                    <h2>Sleep een .md bestand hierheen</h2>
                    <p>of klik op "Nieuw Bestand" om te beginnen met schrijven</p>
                </div>
            </div>

            <!-- Editor and Preview -->
            <div id="editor-container" class="editor-container" style="display: none;">
                <div id="editor-pane" class="editor-pane">
                    <textarea id="markdown-editor" class="markdown-editor" placeholder="Begin met typen... Gebruik Markdown syntax voor opmaak."></textarea>
                </div>
                <div id="preview-pane" class="preview-pane">
                    <div id="content" class="markdown-content"></div>
                </div>
            </div>
        </main>
    </div>

    <input type="file" id="file-input" accept=".md,.markdown" style="display: none;">

    <script src="app.js"></script>
</body>
</html>
